{% load static %}
{% include 'lolapp/header.html' %}
<link rel="stylesheet" href="{% static 'header.css' %}">
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>경기 기록 수정</title>
    <style>
        body { 
            background: #1a1a1a; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            color: #fff; 
            margin: 0; 
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #2a2a2a; 
            border-radius: 10px; 
            padding: 30px; 
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        h2 { 
            color: #90caf9; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 1.8em;
        }
        .mb-3 { 
            margin-bottom: 20px; 
        }
        .form-label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #fff; 
        }
        .form-control, .form-select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #555; 
            border-radius: 6px; 
            background: #333; 
            color: #fff; 
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-control:focus, .form-select:focus { 
            outline: none; 
            border-color: #1976d2; 
            box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.2);
        }
        .form-control:disabled { 
            background: #444; 
            color: #999; 
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            font-size: 1em; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            margin-right: 10px;
            transition: all 0.2s;
        }
        .btn-success { 
            background: #4caf50; 
            color: #fff; 
        }
        .btn-success:hover { 
            background: #45a049; 
        }
        .btn-secondary { 
            background: #6c757d; 
            color: #fff; 
        }
        .btn-secondary:hover { 
            background: #5a6268; 
        }
        .button-group {
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>경기 기록 수정</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">유저</label>
                <input type="text" class="form-control" value="{{ game_data.user.name }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">챔피언</label>
                <select name="champion" class="form-select">
                    {% for champ in champions %}
                    <option value="{{ champ.name }}" {% if champ.name == game_data.champion %}selected{% endif %}>{{ champ.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">라인</label>
                <select name="line" class="form-select">
                    {% for line in lines %}
                    <option value="{{ line }}" {% if line == game_data.line %}selected{% endif %}>{{ line }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">결과</label>
                <select name="result" class="form-select">
                    <option value="win" {% if game_data.result == 'win' %}selected{% endif %}>승리</option>
                    <option value="lose" {% if game_data.result == 'lose' %}selected{% endif %}>패배</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">킬</label>
                <input type="number" name="kill" class="form-control" value="{{ game_data.kill }}">
            </div>
            <div class="mb-3">
                <label class="form-label">데스</label>
                <input type="number" name="death" class="form-control" value="{{ game_data.death }}">
            </div>
            <div class="mb-3">
                <label class="form-label">어시스트</label>
                <input type="number" name="assist" class="form-control" value="{{ game_data.assist }}">
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-success">저장</button>
                <a href="{% url 'database' %}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</body>
</html>
