{% load static %}
<header class="site-header">
    <div class="logo">
        <a href="/">
            <img src="{% static 'img/logo.png' %}" alt="사이트 로고">
        </a>
        <span style="color:#fff; font-size:1.25em; font-weight:bold; letter-spacing:1px;">ACE Stat's</span>
    </div>
    
    <div class="header-right" style="display: flex; gap: 12px; align-items: center;">
        <a href="https://www.deeplol.gg/" target="_blank" rel="noopener noreferrer" class="deeplol-btn" style="
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
            border-radius: 8px;
            padding: 5px 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            border: 2px solid #e91e63;
            box-shadow: 0 4px 16px rgba(233, 30, 99, 0.4);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        ">
            🕹️DEEPLOL
        </a>
        <a href="https://clash.deeplol.gg/team" target="_blank" rel="noopener noreferrer" class="deeplol-internal-btn" style="
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            border-radius: 8px;
            padding: 5px 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            border: 2px solid #9c27b0;
            box-shadow: 0 4px 16px rgba(156, 39, 176, 0.4);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        ">
            ⚔️DEEPLOL 내전기록
        </a>
        <a href="{% url 'patchnote' %}" class="patchnote-btn" style="
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            border-radius: 8px;
            padding: 5px 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            border: 2px solid #1976d2;
            box-shadow: 0 4px 16px rgba(25, 118, 210, 0.4);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        ">
            📖패치노트

    </div>

</header>
